name: Build Geode TEST APK FIXED 2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'geode-launcher-test-22091-source.zip'
      - '.github/workflows/**'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract source
        run: |
          unzip -q geode-launcher-test-22091-source.zip
          test -d android-launcher-main

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install NDK, CMake and Build Tools
        run: |
          sdkmanager --install \
            "ndk;30.0.16248370" \
            "cmake;3.22.1" \
            "build-tools;35.0.0"

      - name: Build APK
        working-directory: android-launcher-main
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleStandardRelease --stacktrace

      - name: Sign and verify APKs
        working-directory: android-launcher-main
        run: |
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          KEYSTORE="$RUNNER_TEMP/geode-test-release.jks"

          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android \
            -keypass android \
            -alias geodetest \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Geode Test, OU=Development, O=Geode Test, C=US"

          find app/build/outputs/apk -type f -name '*-unsigned.apk' -print0 |
          while IFS= read -r -d '' apk; do
            aligned="${apk%-unsigned.apk}-aligned.apk"
            signed="${apk%-unsigned.apk}.apk"

            "$BUILD_TOOLS/zipalign" -f -p 4 "$apk" "$aligned"
            "$BUILD_TOOLS/apksigner" sign \
              --ks "$KEYSTORE" \
              --ks-key-alias geodetest \
              --ks-pass pass:android \
              --key-pass pass:android \
              --out "$signed" "$aligned"

            "$BUILD_TOOLS/apksigner" verify --verbose "$signed"
            rm -f "$aligned" "$apk"
          done

          if ! find app/build/outputs/apk -type f -name '*-release.apk' | grep -q .; then
            echo "No signed APKs were produced."
            exit 1
          fi

      - name: Upload signed APKs
        uses: actions/upload-artifact@v4
        with:
          name: geode-test-apk-signed
          path: android-launcher-main/app/build/outputs/apk/**/*-release.apk
          if-no-files-found: error
          retention-days: 7
